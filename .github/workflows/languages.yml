name: Languages

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go 1.26
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache-dependency-path: packages/go/go.mod
      - name: Test and vet
        working-directory: packages/go
        run: go test ./... && go vet ./...
      - name: Run conformance suite
        run: |
          mkdir -p .private/runtime/go
          go build -o .private/runtime/go/identifold-adapter ./packages/go/cmd/identifold-adapter
          python3 conformance/runner.py --adapter .private/runtime/go/identifold-adapter --vectors vectors --json

  rust:
    name: Rust stable
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Test and format
        working-directory: packages/rust
        run: cargo fmt --check && cargo test --locked && cargo build --release --locked --bin identifold-adapter
      - name: Run conformance suite
        run: python3 conformance/runner.py --adapter packages/rust/target/release/identifold-adapter --vectors vectors --json

  java:
    name: Java 17
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and test
        run: |
          mkdir -p .private/runtime/java/classes
          javac --release 17 -d .private/runtime/java/classes $(find packages/java/src/main packages/java/src/test -name '*.java')
          java -cp .private/runtime/java/classes io.greyfoundry.identifold.IdentifoldTest
      - name: Run conformance suite
        run: python3 conformance/runner.py --adapter conformance/java-adapter.py --vectors vectors --json

  dotnet:
    name: .NET 9
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - name: Test package
        run: dotnet run --project packages/csharp/tests/Identifold.Tests/Identifold.Tests.csproj
      - name: Build adapter
        run: dotnet publish packages/csharp/src/Identifold.Adapter/Identifold.Adapter.csproj -c Release -o .private/runtime/csharp
      - name: Run conformance suite
        run: python3 conformance/runner.py --adapter .private/runtime/csharp/Identifold.Adapter --vectors vectors --json

  php:
    name: PHP 8.5
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.5"
          tools: composer
      - name: Validate and test package
        run: |
          composer validate --strict packages/php/composer.json
          php -d zend.assertions=1 -d assert.exception=1 packages/php/tests/IdentifoldTest.php
      - name: Run conformance suite
        run: python3 conformance/runner.py --adapter conformance/php-adapter.py --vectors vectors --json

  ruby:
    name: Ruby 4.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 snapshot
        with:
          ruby-version: "4.0"
      - name: Test and build package
        working-directory: packages/ruby
        run: ruby test/identifold_test.rb && gem build identifold.gemspec
      - name: Run conformance suite
        run: python3 conformance/runner.py --adapter conformance/ruby-adapter.py --vectors vectors --json

  kotlin:
    name: Kotlin 2.4
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Kotlin compiler
        run: |
          mkdir -p .private/runtime/kotlin
          curl --fail --location --silent --show-error https://github.com/JetBrains/kotlin/releases/download/v2.4.10/kotlin-compiler-2.4.10.zip --output .private/runtime/kotlin.zip
          unzip -q .private/runtime/kotlin.zip -d .private/runtime/kotlin
      - name: Compile and test
        run: |
          mkdir -p .private/runtime/java/classes .private/runtime/kotlin/classes
          javac --release 17 -d .private/runtime/java/classes $(find packages/java/src/main -name '*.java')
          .private/runtime/kotlin/kotlinc/bin/kotlinc -classpath .private/runtime/java/classes \
            packages/kotlin/src/main/kotlin/io/greyfoundry/identifold/KotlinIdentifold.kt \
            packages/kotlin/src/main/kotlin/io/greyfoundry/identifold/KotlinAdapter.kt \
            packages/kotlin/src/test/kotlin/io/greyfoundry/identifold/IdentifoldTest.kt \
            -d .private/runtime/kotlin/classes
          java -cp ".private/runtime/java/classes:.private/runtime/kotlin/classes:.private/runtime/kotlin/kotlinc/lib/kotlin-stdlib.jar" \
            io.greyfoundry.identifold.IdentifoldTestKt
      - name: Run conformance suite
        env:
          IDENTIFOLD_KOTLIN_CLASSPATH: .private/runtime/java/classes:.private/runtime/kotlin/classes:.private/runtime/kotlin/kotlinc/lib/kotlin-stdlib.jar
        run: python3 conformance/runner.py --adapter conformance/kotlin-adapter.py --vectors vectors --json

  swift:
    name: Swift 6.3
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.3.3"
      - name: Format and test
        run: |
          swift format lint --strict --recursive packages/swift/Sources packages/swift/Tests packages/swift/Package.swift
          swift test --package-path packages/swift
      - name: Run conformance suite
        run: |
          SWIFT_BIN_PATH="$(swift build --package-path packages/swift --show-bin-path)"
          python3 conformance/runner.py --adapter "$SWIFT_BIN_PATH/identifold-adapter" --vectors vectors --json
