name: Python

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        run: python -m pip install --disable-pip-version-check build==1.6.0 -e "./packages/python[test]"

      - name: Build distributions
        run: python -m build packages/python

      - name: Test Python package
        run: python -m pytest packages/python/tests -q

      - name: Run production example
        run: python examples/python/basic.py

      - name: Lint Python package
        run: ruff check packages/python/src packages/python/tests conformance/python-adapter.py

      - name: Run Python conformance adapter
        run: python conformance/runner.py --adapter conformance/python-adapter.py --vectors vectors --json
