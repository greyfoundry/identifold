[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "identifold"
version = "1.0.0"
description = "Python implementation of the Identifold specification."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "typeid-python>=0.3.10,<0.4",
  "uuid6>=2025.0.1,<2026",
  "uuid-utils>=0.17,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "ruff>=0.16.5,<0.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]
