[package]
name = "identifold"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Identifold 1.0 identifiers for Rust"
repository = "https://github.com/greyfoundry/identifold"

[dependencies]
mysql_async = { version = "0.37.1", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"], optional = true }
tokio-postgres = { version = "0.7", optional = true }

[features]
default = []
mysql = ["dep:mysql_async", "dep:tokio"]
postgres = ["dep:tokio-postgres"]
sqlite = ["dep:rusqlite"]

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "identifold-adapter"
path = "src/bin/adapter.rs"
