[package]
name = "identifold"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Identifold 1.0 identifiers for Rust"
repository = "https://github.com/greyfoundry/identifold"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
futures = "0.3"

[[bin]]
name = "identifold-adapter"
path = "src/bin/adapter.rs"
