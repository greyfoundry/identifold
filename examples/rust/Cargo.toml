[package]
name = "identifold-example-rust"
version = "1.0.0"
edition = "2024"
publish = false
default-run = "identifold-example-rust"

[dependencies]
identifold = { path = "../../packages/rust", features = ["mysql", "postgres", "sqlite"] }
mysql_async = "0.37.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"
